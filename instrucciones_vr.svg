<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 920" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&amp;display=swap');
      .step-title { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 22px; fill: #004370; }
      .step-bold { font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 16px; fill: #005C96; }
      .step-desc { font-family: 'Montserrat', sans-serif; font-weight: 500; font-size: 14.5px; fill: #475569; }
      .num-text { font-family: 'Montserrat', sans-serif; font-weight: 900; font-size: 20px; fill: #FFFFFF; }
      .screen-text { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 24px; fill: #00A9E0; }
    </style>
    
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.07"/>
    </filter>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#005C96"/>
      <stop offset="100%" stop-color="#00365c"/>
    </linearGradient>

    <linearGradient id="cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A9E0"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- ==================== PASO 1: Run VR App (Superior Izquierda) ==================== -->
  <g transform="translate(20, 20)">
    <rect width="365" height="425" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/>
    
    <!-- Header Paso -->
    <circle cx="48" cy="48" r="22" fill="url(#primary-grad)"/>
    <text x="48" y="55" text-anchor="middle" class="num-text">1</text>
    <text x="82" y="56" class="step-title">Run VR App</text>
    
    <!-- Ilustración Teléfono Grande -->
    <g transform="translate(48, 95)">
      <!-- Smartphone -->
      <rect x="0" y="0" width="270" height="175" rx="18" fill="#1E293B" stroke="#334155" stroke-width="3"/>
      <!-- Pantalla activa -->
      <rect x="12" y="12" width="246" height="151" rx="10" fill="#0F172A"/>
      
      <!-- Lado Izquierdo (L) -->
      <rect x="20" y="20" width="105" height="135" rx="8" fill="#1E293B" stroke="#00A9E0" stroke-width="2.5" stroke-dasharray="4,4"/>
      <path d="M 32 40 Q 72 32 112 40 Q 118 78 112 120 Q 72 130 32 120 Q 26 78 32 40 Z" fill="#00365c" opacity="0.6"/>
      <text x="72" y="90" text-anchor="middle" class="screen-text">L</text>
      
      <!-- Línea Divisoria Central -->
      <line x1="135" y1="12" x2="135" y2="163" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="4,4"/>
      
      <!-- Lado Derecho (R) -->
      <rect x="145" y="20" width="105" height="135" rx="8" fill="#1E293B" stroke="#00A9E0" stroke-width="2.5" stroke-dasharray="4,4"/>
      <path d="M 157 40 Q 197 32 237 40 Q 243 78 237 120 Q 197 130 157 120 Q 151 78 157 40 Z" fill="#00365c" opacity="0.6"/>
      <text x="197" y="90" text-anchor="middle" class="screen-text">R</text>

      <!-- Altavoz / Notch -->
      <circle cx="6" cy="87" r="3.5" fill="#64748B"/>
    </g>

    <!-- Texto Grande y Legible -->
    <text x="182" y="325" text-anchor="middle" class="step-bold">Abre tu video o app VR 360°</text>
    <text x="182" y="355" text-anchor="middle" class="step-desc">Pon la pantalla en modo dividido</text>
    <text x="182" y="380" text-anchor="middle" class="step-desc">(formato estereoscópico L y R)</text>
  </g>

  <!-- ==================== PASO 2: Unfold VR (Superior Derecha) ==================== -->
  <g transform="translate(415, 20)">
    <rect width="365" height="425" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/>
    
    <!-- Header Paso -->
    <circle cx="48" cy="48" r="22" fill="url(#primary-grad)"/>
    <text x="48" y="55" text-anchor="middle" class="num-text">2</text>
    <text x="82" y="56" class="step-title">Unfold VR</text>

    <!-- Ilustración Mecánica Grande -->
    <g transform="translate(45, 95)">
      <!-- Eje Central -->
      <rect x="122" y="10" width="26" height="165" rx="12" fill="#00365c"/>
      <circle cx="135" cy="28" r="8" fill="#00A9E0"/>
      <circle cx="135" cy="155" r="8" fill="#00A9E0"/>

      <!-- Brazo Izquierdo Desplegándose -->
      <g transform="rotate(-28 135 28)">
        <rect x="15" y="18" width="115" height="30" rx="10" fill="#00A9E0" stroke="#005C96" stroke-width="2"/>
        <circle cx="50" cy="33" r="16" fill="#FFFFFF" stroke="#00365c" stroke-width="3"/>
        <circle cx="50" cy="33" r="10" fill="#E0F2FE"/>
        <!-- Aleta -->
        <path d="M 15 48 L 40 100 L 95 100 L 115 48 Z" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5" opacity="0.8"/>
      </g>

      <!-- Brazo Derecho Desplegándose -->
      <g transform="rotate(28 135 28)">
        <rect x="140" y="18" width="115" height="30" rx="10" fill="#00A9E0" stroke="#005C96" stroke-width="2"/>
        <circle cx="220" cy="33" r="16" fill="#FFFFFF" stroke="#00365c" stroke-width="3"/>
        <circle cx="220" cy="33" r="10" fill="#E0F2FE"/>
        <!-- Aleta -->
        <path d="M 155 48 L 175 100 L 230 100 L 255 48 Z" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5" opacity="0.8"/>
      </g>

      <!-- Flechas Grandes de Apertura -->
      <path d="M 70 145 Q 95 175 118 160" fill="none" stroke="#005C96" stroke-width="4" stroke-linecap="round"/>
      <polygon points="62,150 70,135 78,145" fill="#005C96"/>

      <path d="M 200 145 Q 175 175 152 160" fill="none" stroke="#005C96" stroke-width="4" stroke-linecap="round"/>
      <polygon points="208,150 200,135 192,145" fill="#005C96"/>
    </g>

    <!-- Texto Grande y Legible -->
    <text x="182" y="325" text-anchor="middle" class="step-bold">Despliega el mini visor</text>
    <text x="182" y="355" text-anchor="middle" class="step-desc">Abre las alas hacia los costados</text>
    <text x="182" y="380" text-anchor="middle" class="step-desc">para extender ambos lentes</text>
  </g>

  <!-- ==================== PASO 3: Placement (Inferior Izquierda) ==================== -->
  <g transform="translate(20, 475)">
    <rect width="365" height="425" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/>
    
    <!-- Header Paso -->
    <circle cx="48" cy="48" r="22" fill="url(#primary-grad)"/>
    <text x="48" y="55" text-anchor="middle" class="num-text">3</text>
    <text x="82" y="56" class="step-title">Placement</text>

    <!-- Ilustración Acople Smartphone Grande -->
    <g transform="translate(48, 85)">
      <!-- Celular Base -->
      <rect x="0" y="55" width="270" height="125" rx="16" fill="#1E293B" stroke="#475569" stroke-width="3"/>
      <rect x="12" y="65" width="246" height="105" rx="8" fill="#0F172A"/>

      <!-- Pantallas L / R tenues -->
      <rect x="22" y="73" width="105" height="89" rx="6" fill="#00365c" opacity="0.5"/>
      <rect x="143" y="73" width="105" height="89" rx="6" fill="#00365c" opacity="0.5"/>

      <!-- Mini Visor bajando sobre el borde superior -->
      <g transform="translate(35, 5)">
        <!-- Clip de anclaje -->
        <rect x="90" y="15" width="20" height="45" rx="5" fill="#00A9E0"/>
        <!-- Barra de soporte frontal -->
        <rect x="0" y="5" width="200" height="42" rx="14" fill="#005C96" stroke="#00A9E0" stroke-width="3"/>
        <circle cx="55" cy="26" r="16" fill="#FFFFFF" stroke="#00365c" stroke-width="3"/>
        <circle cx="55" cy="26" r="10" fill="#E0F2FE"/>
        <circle cx="145" cy="26" r="16" fill="#FFFFFF" stroke="#00365c" stroke-width="3"/>
        <circle cx="145" cy="26" r="10" fill="#E0F2FE"/>
      </g>

      <!-- Flechas Grandes hacia abajo -->
      <path d="M 60 40 L 60 62 M 60 62 L 54 55 M 60 62 L 66 55" stroke="#00A9E0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 210 40 L 210 62 M 210 62 L 204 55 M 210 62 L 216 55" stroke="#00A9E0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Texto Grande y Legible -->
    <text x="182" y="325" text-anchor="middle" class="step-bold">Engancha al smartphone</text>
    <text x="182" y="355" text-anchor="middle" class="step-desc">Fija el clip del visor centrado</text>
    <text x="182" y="380" text-anchor="middle" class="step-desc">en el borde superior de tu pantalla</text>
  </g>

  <!-- ==================== PASO 4: Alignment (Inferior Derecha) ==================== -->
  <g transform="translate(415, 475)">
    <rect width="365" height="425" rx="20" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="url(#shadow)"/>
    
    <!-- Header Paso -->
    <circle cx="48" cy="48" r="22" fill="url(#primary-grad)"/>
    <text x="48" y="55" text-anchor="middle" class="num-text">4</text>
    <text x="82" y="56" class="step-title">Alignment</text>

    <!-- Ilustración Alineación Grande -->
    <g transform="translate(48, 85)">
      <!-- Lentes Superiores alineados -->
      <g transform="translate(15, 0)">
        <path d="M 0 25 Q 120 5 240 25 Q 210 70 120 55 Q 30 70 0 25 Z" fill="#005C96" stroke="#00A9E0" stroke-width="2"/>
        <circle cx="65" cy="35" r="22" fill="#FFFFFF" stroke="#00365c" stroke-width="4"/>
        <circle cx="65" cy="35" r="14" fill="#E0F2FE"/>
        <circle cx="175" cy="35" r="22" fill="#FFFFFF" stroke="#00365c" stroke-width="4"/>
        <circle cx="175" cy="35" r="14" fill="#E0F2FE"/>
      </g>

      <!-- Smartphone Abajo -->
      <rect x="0" y="80" width="270" height="100" rx="14" fill="#1E293B" stroke="#334155" stroke-width="3"/>
      <rect x="10" y="88" width="118" height="84" rx="6" fill="#0F172A"/>
      <text x="69" y="138" text-anchor="middle" class="screen-text" font-size="20">L</text>

      <rect x="142" y="88" width="118" height="84" rx="6" fill="#0F172A"/>
      <text x="201" y="138" text-anchor="middle" class="screen-text" font-size="20">R</text>

      <!-- Línea Guía de Alineación (Roja brillante punteada) -->
      <line x1="135" y1="0" x2="135" y2="185" stroke="#EF4444" stroke-width="3.5" stroke-dasharray="6,4"/>
      
      <!-- Sello de Centrado Correcto (Check Verde) -->
      <circle cx="135" cy="0" r="14" fill="#10B981" stroke="#FFFFFF" stroke-width="2.5"/>
      <path d="M 129 0 L 133 4 L 141 -4" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round"/>
    </g>

    <!-- Texto Grande y Legible -->
    <text x="182" y="325" text-anchor="middle" class="step-bold">Alinea al centro exacto</text>
    <text x="182" y="355" text-anchor="middle" class="step-desc">Haz coincidir el centro del visor</text>
    <text x="182" y="380" text-anchor="middle" class="step-desc">con la división del video</text>
  </g>
</svg>