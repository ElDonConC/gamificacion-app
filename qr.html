<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Código QR &middot; Evaluación VR-RESET UDD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
    }
    body {
      background: #00365c;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: #1E293B;
    }
    .poster {
      background: white;
      border-radius: 24px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      border-top: 8px solid #00A9E0;
    }
    .badge {
      display: inline-block;
      background: #E0F2FE;
      color: #005C96;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 6px 16px;
      border-radius: 50px;
      margin-bottom: 1rem;
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 800;
      color: #004370;
      margin-bottom: 0.5rem;
    }
    p {
      color: #64748B;
      font-size: 0.95rem;
      margin-bottom: 1.5rem;
    }
    #qrcode {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 1.5rem auto;
      padding: 14px;
      background: white;
      border: 3px solid #E2E8F0;
      border-radius: 16px;
      width: fit-content;
    }
    .url-tag {
      font-size: 0.8rem;
      color: #005C96;
      font-weight: 600;
      word-break: break-all;
      background: #F1F5F9;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 1rem;
    }
    .btn-print {
      background: #005C96;
      color: white;
      border: none;
      padding: 0.8rem 1.6rem;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .btn-print:hover {
      background: #004370;
    }
    .poster-instructions {
      margin-top: 1.5rem;
      padding-top: 1.2rem;
      border-top: 2px dashed #CBD5E1;
      text-align: center;
    }
    .instructions-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #004370;
      margin-bottom: 0.8rem;
    }
    .instructions-img {
      width: 100%;
      border-radius: 12px;
      border: 1px solid #E2E8F0;
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
    }
    @media print {
      body { background: white; padding: 0; }
      .poster { box-shadow: none; border: 2px solid #ccc; max-width: 100%; }
      .btn-print { display: none; }
    }
  </style>
</head>
<body>
  <div class="poster">
    <span class="badge">Stand VR-RESET &middot; Pausa Activa</span>
    <h1>¡Evalúa tu Experiencia!</h1>
    <p>Escanea este código con tu celular y ayúdanos respondiendo 4 preguntas breves.</p>
    <div id="qrcode"></div>
    <div class="url-tag" id="urlText">Cargando enlace...</div>
    <button class="btn-print" onclick="window.print()">🖨️ Imprimir Cartel para el Stand</button>

    <div class="poster-instructions">
      <div class="instructions-title">👓 Instrucciones de Uso: Mini VR Box</div>
      <img src="instrucciones_vr.svg" alt="Instrucciones Mini VR Box" class="instructions-img">
    </div>
  </div>

  <script>
    // URL por defecto para GitHub Pages del repositorio
    const repoPagesUrl = "https://eldonconc.github.io/gamificacion-app/evaluacion.html";
    document.getElementById('urlText').innerText = repoPagesUrl;

    new QRCode(document.getElementById("qrcode"), {
      text: repoPagesUrl,
      width: 210,
      height: 210,
      colorDark : "#00365c",
      colorLight : "#ffffff",
      correctLevel : QRCode.CorrectLevel.H
    });
  </script>
</body>
</html>
