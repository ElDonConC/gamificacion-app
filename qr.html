<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Código QR &middot; Evaluación VR-RESET UDD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Montserrat', sans-serif;
    }
    body {
      background: #00365c;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      color: #1E293B;
    }
    .poster {
      background: white;
      border-radius: 20px;
      padding: 1.8rem 2rem;
      width: 100%;
      max-width: 680px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      border-top: 8px solid #00A9E0;
    }
    .badge {
      display: inline-block;
      background: #E0F2FE;
      color: #005C96;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 5px 14px;
      border-radius: 50px;
      margin-bottom: 0.6rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #004370;
      margin-bottom: 0.3rem;
    }
    p {
      color: #64748B;
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }
    #qrcode {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 0.8rem auto;
      padding: 10px;
      background: white;
      border: 2px solid #E2E8F0;
      border-radius: 14px;
      width: fit-content;
    }
    .url-tag {
      font-size: 0.78rem;
      color: #005C96;
      font-weight: 600;
      word-break: break-all;
      background: #F1F5F9;
      padding: 6px 12px;
      border-radius: 8px;
      margin-bottom: 0.8rem;
    }
    .btn-print {
      background: #005C96;
      color: white;
      border: none;
      padding: 0.7rem 1.4rem;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-print:hover {
      background: #004370;
    }
    .poster-instructions {
      margin-top: 1.2rem;
      padding-top: 1rem;
      border-top: 2px dashed #CBD5E1;
      text-align: center;
    }
    .instructions-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: #004370;
      margin-bottom: 0.6rem;
    }
    .instructions-img {
      width: 100%;
      border-radius: 10px;
      border: 1px solid #E2E8F0;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    /* Reglas estrictas para impresión en 1 sola página (A4 / Carta) */
    @page {
      size: auto;
      margin: 8mm 10mm;
    }

    @media print {
      html, body {
        background: white !important;
        padding: 0 !important;
        margin: 0 !important;
        height: 100% !important;
        overflow: hidden !important;
      }
      .poster {
        box-shadow: none !important;
        border: 2px solid #005C96 !important;
        border-top: 6px solid #00A9E0 !important;
        max-width: 100% !important;
        width: 100% !important;
        padding: 12px 18px !important;
        margin: 0 auto !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }
      .badge {
        margin-bottom: 4px !important;
        padding: 3px 10px !important;
        font-size: 0.68rem !important;
      }
      h1 {
        font-size: 1.3rem !important;
        margin-bottom: 2px !important;
      }
      p {
        font-size: 0.82rem !important;
        margin-bottom: 6px !important;
      }
      #qrcode {
        padding: 6px !important;
        margin-bottom: 6px !important;
        border-width: 1.5px !important;
      }
      #qrcode canvas, #qrcode img {
        width: 140px !important;
        height: 140px !important;
      }
      .url-tag {
        font-size: 0.72rem !important;
        padding: 4px 8px !important;
        margin-bottom: 6px !important;
      }
      .btn-print {
        display: none !important;
      }
      .poster-instructions {
        margin-top: 6px !important;
        padding-top: 6px !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }
      .instructions-title {
        font-size: 0.82rem !important;
        margin-bottom: 4px !important;
      }
      .instructions-img {
        max-height: 230px !important;
        width: auto !important;
        max-width: 100% !important;
        object-fit: contain !important;
        margin: 0 auto !important;
        display: block !important;
      }
    }
  </style>
</head>
<body>
  <div class="poster">
    <span class="badge">Stand VR-RESET &middot; Pausa Activa</span>
    <h1>¡Evalúa tu Experiencia!</h1>
    <p>Escanea este código con tu celular y ayúdanos respondiendo 4 preguntas breves.</p>
    <div id="qrcode"></div>
    <div class="url-tag" id="urlText">Cargando enlace...</div>
    <button class="btn-print" onclick="window.print()">🖨️ Imprimir Cartel para el Stand</button>

    <div class="poster-instructions">
      <div class="instructions-title">👓 Instrucciones de Uso: Mini VR Box</div>
      <img src="instrucciones_vr.svg" alt="Instrucciones Mini VR Box" class="instructions-img">
    </div>
  </div>

  <script>
    const repoPagesUrl = "https://eldonconc.github.io/gamificacion-app/evaluacion.html";
    document.getElementById('urlText').innerText = repoPagesUrl;

    new QRCode(document.getElementById("qrcode"), {
      text: repoPagesUrl,
      width: 180,
      height: 180,
      colorDark : "#00365c",
      colorLight : "#ffffff",
      correctLevel : QRCode.CorrectLevel.H
    });
  </script>
</body>
</html>
